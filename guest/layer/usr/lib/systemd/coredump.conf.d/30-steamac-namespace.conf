[Coredump]
# Native games run in pressure-vessel: their libraries are not in the host
# mount namespace. systemd 257 can use the crashing process's filesystem to
# resolve its stack. Core files remain private; reports include text only.
EnterNamespace=yes
# Do not reduce ProcessSizeMax: exceeding it prevents backtrace generation.
# Storage=none still writes the complete temporary core for stack extraction.
