# steamac: games launched by Steam run in transient user scopes named
# app-steam-app<appid>-<pid>.scope (steam-launch-wrapper with
# STEAM_LAUNCH_WRAPPER_SCOPE=true; this prefix drop-in applies to all of them).
# They are only stopped when the user manager shuts down, after Steam itself
# has exited, with the scope default of 90 s - a Proton/FEX process that
# ignores SIGTERM would hold a power-off for 1.5 min. 5 s matches the stock
# vte-spawn-.scope.d/defaults.conf.
[Scope]
TimeoutStopSec=5s
