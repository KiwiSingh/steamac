# steamac: a VM has nothing that wakes it from a kernel suspend (Steam's idle
# auto-sleep or Power > Sleep froze the virtio devices in s2idle and SteamOS
# never came back). Instead of systemd-sleep, the agent asks the launcher over
# the virtio-console port fx.sleep to pause the whole VM ("SteamOS is
# sleeping"; a click, key, controller button or the Dock icon wakes it) and
# returns once it runs again, with the system-sleep hooks run around it like
# systemd-sleep does (guest/progress-agent/src/sleep.rs). Without the port it
# fails the sleep rather than suspend.
[Service]
ExecStart=
ExecStart=/usr/lib/steamac/fx-progress-agent sleep suspend
# The guest's clocks do not run while the VM is paused, but never time out.
TimeoutStartSec=infinity
