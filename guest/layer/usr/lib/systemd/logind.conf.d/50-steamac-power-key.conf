# steamac: the VM's power button is libkrun's gpio-keys "GPIO Key Poweroff",
# which libkrun's device tree binds to KEY_RESTART (devices/src/fdt/aarch64.rs).
# The launcher presses it for window close / Cmd+Q / power menu, i.e. a
# power-off request; with logind's default HandleRebootKey=reboot the guest
# rebooted instead. (HandlePowerKey=ignore from the stock
# /etc/systemd/logind.conf.d/10-logind-no-powerbutton.conf stays: KEY_POWER
# is steamos-powerbuttond's job on real hardware.)
[Login]
HandleRebootKey=poweroff
HandleRebootKeyLongPress=poweroff
