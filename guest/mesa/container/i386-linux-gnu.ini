# Meson cross file for the i386 (lib32) Venus build, Arch multilib style.
# cpu = 'x86' makes Mesa name the manifest virtio_icd.x86.json, like the provider's freedreno_icd.x86.json.
[binaries]
c = ['gcc', '-m32']
cpp = ['g++', '-m32']
ar = 'gcc-ar'
strip = 'strip'
pkg-config = 'pkg-config'

[properties]
pkg_config_libdir = ['/usr/lib32/pkgconfig', '/usr/share/pkgconfig']

[host_machine]
system = 'linux'
cpu_family = 'x86'
cpu = 'x86'
endian = 'little'
